[project]
name = "bulk-certificate-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shaline444", email = "shalinimonisha73@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "pydantic[email]>=2.13.5",
    "reportlab>=5.0.1",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
bulk-certificate-generator = "bulk_certificate_generator:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
